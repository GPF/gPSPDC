name: Dreamcast build

on:
  push:
    branches: [dreamcast, 'cursor/**']
  pull_request:
    branches: [dreamcast]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile gdC.elf
        run: docker run --rm -v "${{ github.workspace }}:/src" -w /src/dc einsteinx2/dcdev-kos-toolchain:gcc-9 make
      - name: Verify gdC.elf
        run: test -f dc/gdC.elf
