name: Dreamcast build

on:
  push:
    branches: [dreamcast, 'cursor/**']
  pull_request:
    branches: [dreamcast]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host contract tests
        run: make -C tests test
      - name: Cross-compile gdC.elf
        run: ./scripts/dc-build.sh
      - name: Verify gdC.elf
        run: test -f dc/gdC.elf
